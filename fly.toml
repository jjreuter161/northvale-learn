# Fly.io settings. Change "app" to your app's name (it becomes
# https://<app>.fly.dev), and "primary_region" to the closest region
# ("dfw" Dallas, "qro" Querétaro, "iad" Virginia…). See docs/DEPLOY.md.
app = "northvale-learn"
primary_region = "dfw"

[build]

[env]
  ALLOWED_HOSTS = "northvale-learn.fly.dev"

[http_service]
  internal_port = 8950
  force_https = true
  # One always-on machine: the data file lives on its disk.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[mounts]]
  source = "northvale_data"
  destination = "/data"
  snapshot_retention = 14

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
