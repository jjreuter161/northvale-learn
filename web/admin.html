<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Northvale Learn · Admin</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <style>
      :root { --bg: #F7F2E8; --card: #FFFDF8; --ink: #1B3560; --mid: #3e5376; --low: #546683; --line: #E3D9C6; --good: #1B3560; --bad: #A21A22; --brand: #C8202A; }
      @media (prefers-color-scheme: dark) { :root { --bg: #1B3560; --card: #233F70; --ink: #F7F2E8; --mid: #d4d4d2; --low: #bec1c5; --line: #46679F; --good: #F7F2E8; --bad: #FF8E8B; --brand: #F7F2E8; } }
      * { box-sizing: border-box }
      body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; font-variant-numeric: tabular-nums }
      main { max-width: 1040px; margin: 0 auto; padding: 24px 16px 48px }
      h1 { font-size: 24px; margin: 0 0 4px; letter-spacing: -.4px }
      h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .5px; color: var(--low); margin: 28px 0 10px }
      .muted { color: var(--mid) }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px }
      .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px }
      .big { font-size: 28px; font-weight: 700; letter-spacing: -.5px }
      .label { font-size: 13px; color: var(--mid) }
      table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden }
      th, td { text-align: left; padding: 9px 12px; border-top: 1px solid var(--line); vertical-align: top; font-size: 14px }
      th { background: var(--bg); font-weight: 600; color: var(--mid); border-top: none }
      form { display: flex; gap: 8px; margin: 24px 0 }
      input { flex: 1; font: inherit; padding: 11px 12px; border: 1px solid var(--line); border-radius: 10px }
      button { font: inherit; font-weight: 600; padding: 11px 16px; border: 0; border-radius: 10px; background: var(--brand); color: var(--card); cursor: pointer }
      .err { color: var(--bad) }
      .bar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; margin-top: 8px }
      .bar > div { height: 100%; background: var(--good) }
      pre { white-space: pre-wrap; font-size: 12px; color: var(--mid); margin: 6px 0 0 }
      button.quiet { background: var(--line); color: var(--ink) }
      .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 10px }
      .row input { flex: 1; min-width: 200px }
      ul { margin: 8px 0 0; padding-left: 18px }
      li button { padding: 4px 10px; font-size: 13px; margin-left: 6px }
    </style>
  </head>
  <body>
    <main>
      <h1>Northvale Learn · Admin</h1>
      <p class="muted" id="sub">Private. Enter the ADMIN_TOKEN from the server's settings.</p>
      <form id="login"><input id="token" type="password" autocomplete="off" placeholder="Admin token" /><button>Show stats</button></form>
      <p class="err" id="error"></p>
      <div id="out"></div>
    </main>
    <script src="/admin.js"></script>
  </body>
</html>
